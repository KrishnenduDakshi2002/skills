# .external-api-testing.toml — runtime-testing config for test-external-api-port.
# Keep this file at the target repository root and GITIGNORE it — the API key
# below is a secret. Keys never appear in artifacts; captures show <redacted>.

[hosts]
# Base URLs before any global prefix/version. The skill ASKS where each server
# runs (local "http://localhost:<port>" or deployed
# "https://staging-core.tagmango.com") — it never assumes. Answers persist here.
external_api = ""   # external surface (apps/core-api serve)
legacy_api   = ""   # apps/api server used as the legacy oracle
core_api     = ""   # apps/core-api server

[auth]
external_custom_host = ""   # tenant/custom-host URL bound to the API key below
external_api_key     = ""   # the external API key issued for that custom host
legacy_bearer_env    = ""   # env var holding auth for legacy oracle calls
core_bearer_env      = ""   # env var holding auth for core oracle calls

[tenant]
identifier = ""    # test tenant/creator the scenarios run against
disposable = false # true only when this tenant's data may be freely created and mutated

[execution]
allow_write_scenarios     = false # explicit opt-in; also requires tenant.disposable = true
request_timeout_ms        = 15000
delay_between_requests_ms = 250

[artifacts]
dir = ".scratch/external-api-ports"  # runs land under <dir>/<operation>/test-runs/<run-id>/
